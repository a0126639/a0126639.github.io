<script>
    // --- 資料設定 ---
    const links = [
      {
        id: 'login',
        label: '登入',
        isExternal: true,
        url: 'https://www.jljh.com.tw/usedcust/index.php?mkind=1&list_bno=BD&list_area=A&cate_no=&mnotea=&bagok=%E6%90%9C%E5%B0%8B'
      },
      {
        id: 'announcement',
        label: '最新公告',
        summary: '最新消息與店舖公告。'
      },
      { id: 'about', label: '關於我們', summary: '關於本網站的背景故事。' },
      { id: 'rule', label: '寄賣須知', summary: '寄賣規則條件須知。' },
      { id: 'contact', label: '聯絡我們', summary: '聯絡方式資訊。' },
      { id: 'privacy', label: '隱私權政策', summary: '隱私權與 Cookie 政策。', hideInNav: true },
    ];

    const navList = document.getElementById('nav-list');
    const contentTitle = document.getElementById('content-title');
    const contentBody = document.getElementById('content-body');
    document.getElementById('year').textContent = new Date().getFullYear();

    // ==========================================
    // ★ 修正版：網址錨點偵測 (Deep Linking)
    // ==========================================

    // 1. 抓取網址 Hash 並處理 LINE 可能附加的參數 (例如 #rule?openExternalBrowser=1)
    const getHashId = () => {
      const rawHash = window.location.hash.replace('#', '');
      return rawHash.split('?')[0]; // 切掉問號之後的所有內容
    };

    // 2. 初始化 activeId：先看網址有沒有 hash，若無或無效則預設 'announcement'
    const initialHash = getHashId();
    const isValidHash = links.some(link => link.id === initialHash && !link.isExternal);
    let activeId = isValidHash ? initialHash : 'announcement';

    // --- 產生按鈕 ---
    function renderNav() {
      navList.innerHTML = '';

      links.filter(link => !link.hideInNav).forEach(link => {
        const btn = document.createElement('button');
        btn.className = 'px-5 py-2 text-base font-semibold transition-all hover:text-indigo-600 h-full border-b-2 border-transparent shrink-0';
        btn.textContent = link.label;

        if (activeId === link.id && !link.isExternal) {
          btn.classList.add('nav-active');
        } else {
          btn.classList.add('text-gray-600');
        }

        btn.addEventListener('click', () => handleClick(link));
        navList.appendChild(btn);
      });
    }

    // --- 點擊邏輯 ---
    function handleClick(link) {
      if (link.isExternal) {
        window.open(link.url, '_blank');
      } else {
        activeId = link.id;
        window.location.hash = link.id; // 更新網址 Hash
        updateContent();
        renderNav();
      }
    }

    // --- 更新內容 ---
   function updateContent() {
      const item = links.find(l => l.id === activeId) || links[1]; // 備案：找不到就跳到最新公告

      contentTitle.textContent = item.label;
      contentBody.innerHTML = '<p class="loading">資料讀取中...</p>';

      if (['announcement', 'about', 'rule', 'contact', 'privacy'].includes(item.id)) {
        const fileName = item.id + '.html';

        // 加上時間戳記防止 LINE 快取舊檔案 (?v=...)
        fetch(`${fileName}?v=${new Date().getTime()}`)
          .then(res => {
            if(!res.ok) throw new Error('Missing file');
            return res.text();
          })
          .then(html => {
            contentBody.innerHTML = html;
          })
          .catch(() => {
            contentBody.innerHTML = `
              <div class="p-4 bg-blue-50 text-blue-800 rounded border border-blue-200">
                載入失敗，請嘗試重新整理頁面。<br>
                <span class="text-xs text-gray-500">(目標檔案: ${fileName})</span>
              </div>`;
          });
      }
    }

    // --- 懸浮廣告關閉功能 ---
    function closeAd() {
      const ad = document.getElementById('floating-ad');
      ad.classList.add('translate-y-40', 'opacity-0');
      setTimeout(() => {
        ad.classList.add('hidden');
      }, 300);
    }

    // 監聽網址 Hash 變化（當使用者點選瀏覽器「上一頁」時也能正確切換）
    window.addEventListener('hashchange', () => {
      const newHash = getHashId();
      if (newHash && newHash !== activeId) {
        const item = links.find(l => l.id === newHash);
        if (item) {
          activeId = newHash;
          renderNav();
          updateContent();
        }
      }
    });

    // 初始化執行
    renderNav();
    updateContent();
  </script>
